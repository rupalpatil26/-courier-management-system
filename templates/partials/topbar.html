<!-- Navbar -->
<nav class="main-header navbar navbar-expand navbar-dark border-bottom-0">
  <!-- Left navbar links -->
  <ul class="navbar-nav align-items-center">
    {% if session.get('login_id') %}
    <li class="nav-item">
      <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
    </li>
    {% endif %}
    <li class="nav-item">
      <a class="nav-link text-white font-weight-bold d-flex align-items-center" href="/dashboard?page=home" role="button">
        <span class="badge badge-pill mr-2" style="background: linear-gradient(135deg, #00f0ff, #3b82f6); box-shadow: 0 0 10px rgba(0,240,255,0.4); padding: 0.35rem 0.5rem;"><i class="fas fa-shipping-fast text-dark"></i></span>
        <span style="font-size: 1.05rem; letter-spacing: -0.01em;">{{ system.name | default('Courier Management System') }}</span>
      </a>
    </li>
  </ul>

  <ul class="navbar-nav ml-auto align-items-center">
    <li class="nav-item mr-2">
      <a class="nav-link" data-widget="fullscreen" href="#" role="button" title="Full Screen">
        <i class="fas fa-expand-arrows-alt"></i>
      </a>
    </li>
    <li class="nav-item dropdown">
      <a class="nav-link p-0" data-toggle="dropdown" aria-expanded="true" href="javascript:void(0)">
        <div class="d-flex align-items-center badge-pill" style="cursor: pointer;">
          <div class="rounded-circle mr-2 d-flex align-items-center justify-content-center" style="width: 28px; height: 28px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: #fff; font-size: 0.75rem;">
            <i class="fa fa-user"></i>
          </div>
          <span class="text-white font-weight-bold mr-2">{{ session.get('login_firstname', 'User') | title }}</span>
          <span class="fa fa-chevron-down text-muted" style="font-size: 0.7rem;"></span>
        </div>
      </a>
      <div class="dropdown-menu dropdown-menu-right" aria-labelledby="account_settings">
        <a class="dropdown-item" href="javascript:void(0)" id="manage_account">
          <i class="fa fa-cog mr-2 text-primary"></i> Manage Account
        </a>
        <div class="dropdown-divider" style="border-color: rgba(255,255,255,0.08);"></div>
        <a class="dropdown-item text-danger" href="/api/auth/logout">
          <i class="fa fa-power-off mr-2 text-danger"></i> Logout
        </a>
      </div>
    </li>
  </ul>
</nav>
<!-- /.navbar -->
<script>
  $('#manage_account').click(function(){
    uni_modal('Manage Account', '/modal/manage_user?id={{ session.get("login_id") }}');
  });
</script>
