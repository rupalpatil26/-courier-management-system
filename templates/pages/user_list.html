<div class="col-lg-12">
	<div class="card card-outline card-success">
		<div class="card-header">
			<div class="card-tools">
				<a class="btn btn-block btn-sm btn-default btn-flat border-primary" href="/dashboard?page=new_user"><i class="fa fa-plus"></i> Add New User</a>
			</div>
		</div>
		<div class="card-body">
			<table class="table tabe-hover table-bordered" id="list">
				<thead>
					<tr>
						<th class="text-center">#</th>
						<th>Name</th>
						<th>Email</th>
						<th>Role</th>
						<th>Action</th>
					</tr>
				</thead>
				<tbody>
					{% for row in users %}
					<tr>
						<th class="text-center">{{ loop.index }}</th>
						<td><b>{{ (row['name'] or '') | title }}</b></td>
						<td><b>{{ row['email'] }}</b></td>
						<td><b>{{ 'Admin' if row['type'] == 1 else 'Staff' }}</b></td>
						<td class="text-center">
							<button type="button" class="btn btn-default btn-sm btn-flat border-info wave-effect text-info dropdown-toggle" data-toggle="dropdown" aria-expanded="true">
								Action
							</button>
							<div class="dropdown-menu">
								<a class="dropdown-item view_user" href="javascript:void(0)" data-id="{{ row['id'] }}">View</a>
								<div class="dropdown-divider"></div>
								<a class="dropdown-item" href="/dashboard?page=edit_user&id={{ row['id'] }}">Edit</a>
								<div class="dropdown-divider"></div>
								<a class="dropdown-item delete_user" href="javascript:void(0)" data-id="{{ row['id'] }}">Delete</a>
							</div>
						</td>
					</tr>	
					{% endfor %}
				</tbody>
			</table>
		</div>
	</div>
</div>
<script>
	$(document).ready(function(){
		$('#list').dataTable();
		$('.view_user').click(function(){
			uni_modal("<i class='fa fa-id-card'></i> User Details", "/modal/view_user?id=" + $(this).attr('data-id'));
		});
		$('.delete_user').click(function(){
			_conf("Are you sure to delete this user?", "delete_user", [$(this).attr('data-id')]);
		});
	});
	function delete_user($id){
		start_load();
		$.ajax({
			url: '/api/user/delete',
			method: 'POST',
			data: {id: $id},
			success: function(resp){
				if(resp == 1){
					alert_toast("Data successfully deleted", 'success');
					setTimeout(function(){
						location.reload();
					}, 1500);
				}
			}
		});
	}
</script>
